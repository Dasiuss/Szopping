<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Wspólna lista zakupów">
  <title>Szopping</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Szopping</h1>
    <nav>
      <button id="tab-master" class="tab active" type="button">Lista</button>
      <button id="tab-shopping" class="tab" type="button">Zakupy</button>
    </nav>
  </header>

  <main>
    <section id="view-master">
      <form id="add-form" autocomplete="off">
        <input id="add-input" type="text" placeholder="Nowy element..." maxlength="200" required>
        <button type="submit">Dodaj</button>
      </form>
      <ul id="master-list"></ul>
    </section>

    <section id="view-shopping" hidden>
      <div class="clear-row">
        <button id="clear-btn" type="button">Wyczysc kupione</button>
      </div>
      <ul id="shopping-list"></ul>
    </section>
  </main>

  <footer>
    <span id="status">Ladowanie...</span>
  </footer>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
