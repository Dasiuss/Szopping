<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Wspólna lista zakupów">
  <title>Szopping</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header id="app-header" hidden>
    <nav>
      <button id="tab-master" class="tab active" type="button">Lista</button>
      <button id="tab-shopping" class="tab" type="button">Zakupy</button>
    </nav>
  </header>

  <main>
    <section id="view-login">
      <div class="login-card">
        <h2>Szopping</h2>
        <form id="login-form">
          <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
          <input id="login-password" type="password" placeholder="Haslo" autocomplete="current-password" required>
          <button type="submit">Zaloguj</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </div>
    </section>

    <section id="view-master" hidden>
      <ul id="master-list"></ul>
      <form id="add-form" autocomplete="off">
        <input id="add-input" type="text" placeholder="Nowy element..." maxlength="200" required>
        <button type="submit">Dodaj</button>
      </form>
    </section>

    <section id="view-shopping" hidden>
      <ul id="shopping-list"></ul>
      <div class="clear-row">
        <button id="clear-btn" type="button">Wyczyść kupione</button>
      </div>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
  <script type="module">
    import { RealtimeClient } from 'https://cdn.jsdelivr.net/npm/@supabase/realtime-js@2/+esm';
    window.__rt = window.__rt || {};
    window.__rt.RealtimeClient = RealtimeClient;
    window.__rt.ready = true;
    if (typeof window.__rt.onReady === 'function') window.__rt.onReady();
  </script>
</body>
</html>
